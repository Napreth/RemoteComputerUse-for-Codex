[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remote-computer-use"
version = "0.1.0"
description = "Persistent Codex Computer Use runtime with first-class RDP and VNC backends"
authors = [{ name = "Napreth" }]
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aardwolf==0.2.13",
  "fastapi>=0.115,<1",
  "mcp==2.2.0",
  "openai>=2,<3",
  "pillow>=12,<13",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
  "vnc-remote-control==1.0.4",
]

[project.scripts]
remote-computer-use = "app.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=1,<2", "httpx>=0.28,<1", "ruff>=0.16,<1", "mypy>=1.15", "pyyaml>=6,<7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: opt-in real remote-desktop integration"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
