name: Remote computer checks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: ''
      CUA_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: '0.11.33'
      - name: Enable pnpm 10.26.0
        run: corepack enable
      - name: Install locked workspace
        run: pnpm install --frozen-lockfile
      - name: Install locked remote Python runtime
        run: pnpm python:install
      - name: Check remote runtime, Console, contracts, labs and production build
        env:
          REMOTE_COMPUTER_FRESH_INSTALL_TEST: '1'
        run: pnpm check
      - name: Check managed Python launcher
        run: node --test scripts/launch.test.mjs
